name: CI

# Docs-only changes run nothing: no test reads a Markdown file.
on:
  push:
    branches: [ main, feat/go-conversion ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Integration tests in internal/sshx start their own sshd via testcontainers (Docker is available on ubuntu-latest).
      - run: go test -race ./...
      # The redaction sweeps sample under -race (24x slower, nothing to find); run them in full here.
      - run: go test -count=1 ./internal/config

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run e2e

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Build libghostty-vt from source (macOS)
        if: runner.os == 'macOS'
        run: |
          start=$(date +%s)
          ../scripts/build-ghostty-vt.sh build/natives | tee /tmp/ghostty.log
          grep '^MYGO_GHOSTTY_VT=' /tmp/ghostty.log >> "$GITHUB_ENV"
          echo "libghostty-vt built in $(( $(date +%s) - start )) s"
      - name: mygo terminal plugin tests against that library (macOS)
        if: runner.os == 'macOS'
        run: go test -race github.com/egoist/mygo/plugins/terminal/...
      - run: go vet ./...
      # Without MYGO_GHOSTTY_VT (Linux, Windows) the terminal tests skip; nothing downloads a prebuilt library.
      # Windows: the hub's MCP pipe name is per user, not per SSHGATE_RUNTIME_DIR, so two packages' hubs at once fail with "Access is denied"; run one package at a time.
      - run: go test -race ${{ runner.os == 'Windows' && '-p 1' || '' }} ./...
      - name: Package the app (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-mac.sh
