<html lang="en">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>sshgate</h1><span id="status"></span></header>

    <section id="form" hidden></section>
    <section id="importui" hidden></section>
  </main>
  <script src="app.js"></script>

</html>
